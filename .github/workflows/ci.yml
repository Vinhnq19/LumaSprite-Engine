name: Engine CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - run: npm run benchmark
      - run: npm run benchmark:e2
      - run: npm run benchmark:e23
      - run: npm run benchmark:e24
      - run: npm run benchmark:e3
      - run: npm run benchmark:e32
      - run: npm run benchmark:e33
